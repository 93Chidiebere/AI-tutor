<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Goal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        :root {
            --primary-color: #2F6BFF;
            --accent-color: #FF5F3C;
            --bg-color: #F0F6FF;
            --text-color: #222;
            --font-family: 'Inter', sans-serif;
            --border-radius: 12px;
            --transition-speed: 0.2s;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.5;
            padding: 1.5rem;
        }

        .app__container {
            max-width: 400px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            min-height: 100vh;
            justify-content: center;
        }

        .app__heading {
            font-size: 1.5rem;
            font-weight: 700;
            text-align: center;
        }

        .app__options {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .option {
            display: flex;
            align-items: center;
            padding: 1rem;
            background-color: #fff;
            border: 2px solid transparent;
            border-radius: var(--border-radius);
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-color);
            cursor: pointer;
            transition: border-color var(--transition-speed), background-color var(--transition-speed);
        }

        .option:hover,
        .option:focus {
            border-color: var(--primary-color);
            background-color: #e8f0ff;
        }

        .option__icon {
            font-size: 1.5rem;
            margin-right: 0.75rem;
        }

        .option__text {
            flex: 1;
        }

        .app__continue {
            padding: 1rem;
            background-color: var(--primary-color);
            color: #fff;
            font-weight: 600;
            border: none;
            width: 100%;
            border-radius: var(--border-radius);
            font-size: 1rem;
            cursor: pointer;
            transition: background-color var(--transition-speed);
        }

        .app__continue:hover,
        .app__continue:focus {
            background-color: #1749cc;
        }

        /* Desktop breakpoint */
        @media (min-width: 768px) {
            .app__container {
                padding: 2rem;
                gap: 2.5rem;
            }

            .app__heading {
                font-size: 2rem;
            }

            .option {
                font-size: 1.125rem;
            }

            .option__icon {
                font-size: 1.75rem;
            }
        }
    </style>
</head>

<body class="app">
    <header class="chat__header">
        <a href="index.html"> <button class="chat__back">&#8592;</button></a>
        <h1 class="chat__title">AI Tutor</h1>
    </header>
    <div class="app__container">
        <h1 class="app__heading">Hey Alex, what's your learning goal?</h1>
        <div class="app__options">
            <button class="option">
                <span class="option__icon">📅</span>
                <span class="option__text">Prepare for an exam</span>
            </button>
            <button class="option">
                <span class="option__icon">📚</span>
                <span class="option__text">Understand the basics</span>
            </button>
            <button class="option">
                <span class="option__icon">⚙️</span>
                <span class="option__text">Catch up on missed topics</span>
            </button>
            <button class="option">
                <span class="option__icon">🚀</span>
                <span class="option__text">Learn ahead of my class</span>
            </button>
        </div>
        <a href="topic.html"> <button class="app__continue">Continue</button></a>
    </div>
</body>

</html>
