<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Learn with AI Tutor - Fractions</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    <style type="text/css">
        :root {
            --primary-color: #9B5DE5;
            --background: #ffffff;
            --text-dark: #222;
            --text-light: #666;
            --button-bg: #eef4fb;
            --button-hover: #dbeafe;
            --radius: 12px;
            --font-main: 'Inter', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-main);
            background: var(--background);
            color: var(--text-dark);
            line-height: 1.5;
            padding: 1rem;
        }

        .tutor {
            max-width: 480px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .tutor__header {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .tutor__avatar {
            border-radius: 50%;
            width: 40px;
            height: 40px;
        }

        .tutor__title {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .tutor__message {
            background: #f3f4f6;
            padding: 0.75rem 1rem;
            border-radius: var(--radius);
        }

        .lesson {
            background: #f9fafb;
            padding: 1rem;
            border-radius: var(--radius);
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .lesson__tag {
            background: var(--primary-color);
            color: #fff;
            font-size: 0.75rem;
            padding: 0.3rem 0.75rem;
            border-radius: 999px;
            display: inline-block;
        }

        .lesson__title {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .lesson__illustration img {
            width: 100%;
            max-width: 100%;
        }

        .lesson__question {
            font-weight: 600;
            font-size: 1rem;
        }

        .lesson__actions {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .lesson__actions button {
            background: var(--button-bg);
            border: none;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            border-radius: var(--radius);
            cursor: pointer;
            transition: background 0.3s;
        }

        .lesson__actions button:hover {
            background: var(--button-hover);
        }

        .tutor__input {
            display: flex;
            gap: 0.5rem;
            margin-top: auto;
        }

        .tutor__input input {
            flex: 1;
            padding: 0.75rem;
            border: 1px solid #ccc;
            border-radius: var(--radius);
        }

        .tutor__input button {
            background: var(--primary-color);
            color: #fff;
            border: none;
            padding: 0 1rem;
            border-radius: var(--radius);
            font-size: 1.25rem;
            cursor: pointer;
        }

        /* 🌐 Desktop View */
        @media (min-width: 768px) {
            .tutor {
                max-width: none;
                width: 100%;
                padding: 2rem 4rem;
            }

            .lesson {
                flex-direction: row;
                align-items: flex-start;
                justify-content: space-between;
                gap: 2rem;
            }

            .lesson__illustration img {
                max-width: 250px;
            }

            .lesson__content {
                flex: 1;
            }

            .lesson__actions {
                flex-direction: row;
                justify-content: space-between;
            }

            .lesson__actions button {
                flex: 1;
            }

            .tutor__message {
                font-size: 1.125rem;
            }

            .tutor__title {
                font-size: 1.75rem;
            }
        }
    </style>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <header class="chat__header">
        <a href="study.html"> <button class="chat__back">&#8592;</button></a>
        <h1 class="chat__title">AI Tutor</h1>
    </header>
    <br>
    <main class="tutor">
        <header class="tutor__header">
            <a href="chat.html"> <img src="ava.webp" alt="User Avatar" class="tutor__avatar" /></a>
            <h1 class="tutor__title">Learn with AI Tutor</h1>
        </header>

        <section class="tutor__message">
            <p>Hi! Ready to learn about fractions?</p>
        </section>

        <section class="lesson">
            <div class="lesson__header">
                <span class="lesson__tag">Fractions</span>
                <h2 class="lesson__title">Introduction</h2>
            </div>

            <div class="lesson__illustration">
                <img src="math.png" alt="Fraction Illustration" />
            </div>

            <h3 class="lesson__question">What is a fraction?</h3>

            <div class="lesson__actions">
                <button>Explain again</button>
                <button>More examples</button>
                <button>Next topic</button>
            </div>
        </section>

        <footer class="tutor__input">
            <input type="text" placeholder="Message" />
            <button>&#9658;</button>
        </footer>
    </main>
</body>

</html>
